<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sunset Forecast & Golden Hour Quality | Skying</title>
  <meta name="description" content="Check tonight's sunset quality, cloud cover, visibility and golden-hour forecast for any location with Skying's free seven-day sunset outlook." />
  <meta name="robots" content="index,follow,max-image-preview:large" />
  <meta name="theme-color" content="#f4f0e9" />

  <link rel="canonical" href="https://YOUR-DOMAIN.com/" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="manifest" href="/site.webmanifest" />

  <meta property="og:site_name" content="Skying" />
  <meta property="og:title" content="Sunset Forecast & Golden Hour Quality | Skying" />
  <meta property="og:description" content="Find out whether tonight's sunset will be worth watching with a free seven-day sunset quality forecast." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://YOUR-DOMAIN.com/" />
  <meta property="og:image" content="https://YOUR-DOMAIN.com/og-image.svg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Skying sunset forecast" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Sunset Forecast & Golden Hour Quality | Skying" />
  <meta name="twitter:description" content="Find out whether tonight's sunset will be worth watching with a free seven-day sunset quality forecast." />
  <meta name="twitter:image" content="https://YOUR-DOMAIN.com/og-image.svg" />

  <link rel="preconnect" href="https://api.open-meteo.com" crossorigin />
  <link rel="preconnect" href="https://photon.komoot.io" crossorigin />
  <link rel="preconnect" href="https://ipapi.co" crossorigin />

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Skying",
    "url": "https://YOUR-DOMAIN.com/",
    "description": "Sunset quality and golden-hour forecasts for any location."
  }
  </script>
  <script src="/style-loader.js"></script>
</head>
<body>
  <div class="app">
    <header id="siteHeader" class="compact-empty">
      <div class="header-inner">
        <a href="#top" class="brand">Skying</a>

        <button id="mobileSearchToggle" type="button" class="mobile-search-toggle" aria-label="Change forecast location">
          <span aria-hidden="true">⌖</span><span id="mobileLocationLabel" class="mobile-location-label">Change place</span>
        </button>

        <div id="headerSearch" class="search-wrap header-search hidden">
          <button id="mobileSearchClose" type="button" class="mobile-search-close" aria-label="Close location search">×</button>
          <form class="search-shell" data-search-form autocomplete="off">
            <span class="pin" aria-hidden="true">⌖</span>
            <label for="placeHeader" class="sr-only">Search location</label>
            <input id="placeHeader" data-search-input type="search" placeholder="City, coast, ridge…" aria-autocomplete="list" aria-expanded="false" />
            <button type="button" class="locate-btn" data-locate title="Use precise device location" aria-label="Use precise device location">◎</button>
            <button type="submit" class="find-btn" data-find>Find</button>
          </form>
          <div class="suggestions" data-suggestions role="listbox"></div>
        </div>

      </div>
    </header>

    <main id="top">
      <section id="emptyState" class="empty-stage">
        <div class="empty-inner">
          <h1 class="empty-title">Will the sky be <em>worth it?</em></h1>
          <div class="search-wrap center-search">
            <form class="search-shell centered" data-search-form autocomplete="off">
              <span class="pin" aria-hidden="true">⌖</span>
              <label for="placeCenter" class="sr-only">Search location</label>
              <input id="placeCenter" data-search-input type="search" placeholder="City, coast, ridge…" aria-autocomplete="list" aria-expanded="false" autofocus />
              <button type="button" class="locate-btn" data-locate title="Use precise device location" aria-label="Use precise device location">◎</button>
              <button type="submit" class="find-btn" data-find>Find</button>
            </form>
            <div class="suggestions" data-suggestions role="listbox"></div>
          </div>
          <button id="landingLocate" type="button" class="landing-locate"><span aria-hidden="true">◎</span> Use my current location</button>

          <p id="status" class="status" aria-live="polite"></p>
        </div>
      </section>

      <section id="forecastHero" class="forecast-hero hidden">
        <p id="forecastTopline" class="forecast-topline"></p>
        <div class="score-row">
          <div class="score-left">
            <div id="scoreNumber" class="score-number">0</div>
            <div class="score-meta">
              <div class="of100">of 100</div>
              <h1 id="verdict" class="verdict">—</h1>
            </div>
          </div>
          <div class="sunset-block">
            <div class="sunset-label">Sunset</div>
            <div id="sunsetTime" class="sunset-time">—</div>
          </div>
        </div>
        <div class="score-track"><div id="scoreFill" class="score-fill"></div></div>
      </section>

      <div id="dashboard" class="dashboard hidden">
        <section class="why-card">
          <div>
            <div class="card-kicker">Why this score</div>
            <p id="whyText" class="why-text"></p>
          </div>
          <div class="why-stats">
            <div class="why-stat">
              <div class="why-stat-label">Best window</div>
              <div id="bestWindow" class="why-stat-value"></div>
            </div>
            <div class="why-stat">
              <div class="why-stat-label">Horizon clarity</div>
              <div id="horizonClarity" class="why-stat-value"></div>
            </div>
          </div>
        </section>

        <figure class="photo-card" aria-label="Coral sunset over a Pacific coastal cliff">
          <svg class="sunset-art" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Warm coral sunset over a rugged coastal cliff">
            <defs>
              <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#f8b07d"/>
                <stop offset="0.52" stop-color="#e97043"/>
                <stop offset="1" stop-color="#6d4667"/>
              </linearGradient>
              <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#6b6b79"/>
                <stop offset="1" stop-color="#292c37"/>
              </linearGradient>
              <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
            </defs>
            <rect width="1000" height="700" fill="url(#sky)"/>
            <ellipse cx="720" cy="260" rx="100" ry="65" fill="#ffd6a3" opacity=".78" filter="url(#blur)"/>
            <circle cx="720" cy="260" r="46" fill="#ffe3b8" opacity=".93"/>
            <path d="M0 360 C160 330 240 390 410 350 C540 320 660 335 1000 305 L1000 700 L0 700 Z" fill="url(#sea)"/>
            <path d="M0 520 C170 500 255 570 370 545 C455 526 520 466 614 455 C735 441 802 497 1000 470 L1000 700 L0 700 Z" fill="#1f2229" opacity=".86"/>
            <path d="M0 465 C120 390 218 408 310 462 C365 495 425 520 496 515 L410 700 L0 700 Z" fill="#171714"/>
            <path d="M0 505 C115 438 220 455 315 510 C365 540 398 570 456 578" fill="none" stroke="#38352f" stroke-width="32" opacity=".8"/>
            <path d="M90 418 C137 389 186 391 228 414" fill="none" stroke="#4b463f" stroke-width="12" opacity=".8"/>
            <g opacity=".38" fill="#f6c48a">
              <rect x="635" y="342" width="190" height="4" rx="2"/><rect x="667" y="359" width="130" height="3" rx="2"/><rect x="690" y="377" width="88" height="3" rx="2"/>
            </g>
          </svg>
          <figcaption class="photo-caption">The light worth waiting for</figcaption>
        </figure>

        <section class="outlook">
          <h2 class="section-title">Seven-day outlook</h2>
          <div id="days" class="days"></div>
        </section>

        <section id="metrics" class="metrics"></section>

      </div>
    </main>
  </div>
  <script src="/app-loader.js"></script>
</body>
</html>
